name: Build Island IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: IslandApp
        run: xcodegen generate

      - name: Build archive (unsigned)
        working-directory: IslandApp
        run: |
          xcodebuild -project Island.xcodeproj \
            -scheme Island \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Island.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        working-directory: IslandApp
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/Island.xcarchive/Products/Applications/Island.app build/ipa/Payload/
          cd build/ipa
          zip -r ../Island-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Island-unsigned-ipa
          path: IslandApp/build/Island-unsigned.ipa
