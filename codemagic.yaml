workflows:
  ios-workflow:
    name: Island iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          cd IslandApp
          xcodegen generate
      - name: Build unsigned archive
        script: |
          cd IslandApp
          xcodebuild -project Island.xcodeproj \
            -scheme Island \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Island.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
      - name: Package unsigned IPA
        script: |
          cd IslandApp
          mkdir -p build/ipa/Payload
          cp -r build/Island.xcarchive/Products/Applications/Island.app build/ipa/Payload/
          cd build/ipa
          zip -r ../Island-unsigned.ipa Payload
    artifacts:
      - IslandApp/build/Island-unsigned.ipa
